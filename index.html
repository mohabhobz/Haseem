<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حسيم — واجهة</title>

    <!-- أيقونة التاب: العلامة نفسها اللي في السايد بار، مفيش ملف متكرر.
         الـSVG هو الأساس، والـPNG للمتصفحات القديمة وأيقونة iOS. -->
    <link rel="icon" type="image/svg+xml" href="/haseem-mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#003E31" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ★ Option B: خط واحد في التطبيق كله — IBM Plex Sans Arabic (400/500/600/700).
         مفيش Fustat ولا خطوط هوية منشأة (قرار ٠-١ و٠-٥). -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      /* الثيم بيتطبّق قبل أول رسم عشان مفيش ومضة بيضا */
      (function () {
        try {
          /* الافتراضي فاتح دايمًا — الداكن اختيار صريح من المستخدم */
          document.documentElement.dataset.theme = localStorage.getItem('haseem-theme') || 'light';
        } catch (e) { document.documentElement.dataset.theme = 'light' }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
